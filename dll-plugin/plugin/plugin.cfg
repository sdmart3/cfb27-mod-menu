; Mod Settings - Mod Manager plugin settings. Mod Settings's own settings live in modsettings.ini, in this same folder (read by the
; game when it starts). This file controls only the launcher that loads modsettings.dll into the game. A missing file means
; every default below. Lines are "key = value"; ';' starts a comment.

; 1 = load modsettings.dll into College Football 27 when it is launched from the Mod Manager. 0 = do nothing
; (the plugin stays installed, writes one line to plugin.log per launch, and never touches the game).
plugin_enabled = 1

; Seconds to wait after the game process appears before loading (the game is left alone while it starts up).
settle_sec = 30

; Seconds to wait for the game process to appear after the Mod Manager starts it. When it does not appear in
; time the plugin gives up (logged in plugin.log) and the game runs without Mod Settings.
wait_game_sec = 180

; 1 = stay out of the way when another tool is already set up to run its own copy of this feature in this game, so
; the two never fight over the same game. Mod Settings then does not load for that launch and says why in
; modsettings-status.json and plugin.log. That other tool with its own copy switched off is fine: Mod Settings loads
; normally. 0 = never stay out of the way (advanced; only if you know the two will not collide).
respect_other_tool = 1

; ---- advanced: leave these alone ----
; the game restarts itself at startup, so more than one CollegeFB27.exe can exist for a while. The load waits until the set of game
; processes has held still for stable_sec seconds; if it never does within resolve_sec seconds, the largest one is used.
; stable_sec = 10
; resolve_sec = 120
; poll_ms = 1000
; game_exe = CollegeFB27.exe
; dll = modsettings.dll
; 1 = only a CollegeFB27.exe that was NOT already running when Launch was pressed is ever targeted
; require_new_process = 1
; seconds to wait for the in-game load to finish before giving up
; inject_timeout_sec = 15
; only load into a game whose folder is exactly this (empty = any folder)
; game_dir =
; the other tool's settings that count as "it runs its own copy" (comma-separated; any one non-zero = stay out of the way)
; stand_aside_keys = modsettings
