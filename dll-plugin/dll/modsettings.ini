; Mod Settings (modsettings.dll) - settings, read once when the game starts. Lines are "key = value"; ';' starts a comment.
; Your mod choices do NOT live here: they live in settings.json (beside this file; written when you change a row in the game's
; Mod Settings tab) and values.json (written by the older Mod Settings page).

; 1 = look the game up and write band settings into the loaded dynasty. 0 = do nothing in the game (values.json, ms_get and the
; ini bindings still work).
enabled = 1

; 1 = write a dynasty setting you changed into the loaded dynasty's settings band. 0 = read and report only (modsettings-status.json).
band_write = 1

; 1 = when values.json names a value for a row bound to another mod's ini, rewrite that one key in that ini. 0 = never touch other inis.
ini_bind = 1

; The dynasty screens whose server step carries the band write (1 = on). A change lands the next time one of them runs: the dynasty hub's
; meters / My School panels refresh, or you open Roster or Schedule. Turn one off only if another tool patches the same step.
capture_meters = 1
capture_myschool = 1
capture_roster = 1
capture_schedule = 1

; 1 = fill the game's Settings > Mod Settings tab (needs the Mod Settings tab .fbmod) with one header per mod and its rows. 0 = leave the
; game's settings screen alone (the tab then shows 'The Mod Settings plugin is not running').
tab = 1

; 1 = draw every slider as the game's slider bar. 0 = a slider with up to 21 stops is a row of choices (left / right), a longer one a bar.
slider_native = 0

; 0 = hide the section of a mod that is off in the Mod Manager's selected pack (its manifest names its .fbmod). 1 = show it greyed, "(mod not active)".
show_inactive = 0

; ---- advanced: leave these alone ----
; how often values.json and the manifests are checked for changes (milliseconds, 250..10000)
poll_ms = 1000
; how many capture lines per screen go to modsettings.log
log_captures = 20
; how many calls per tab function go to modsettings.log
log_tab = 20
log_sync = 0
patch_safe = 1
patch_verify = 1
